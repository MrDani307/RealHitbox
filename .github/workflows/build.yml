name: Build RealHitbox

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Android64
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: RealHitbox-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
